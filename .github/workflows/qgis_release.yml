name: Release QGIS Plugin

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to package for manual test run (e.g. 2.0.6)
        required: true
      release_tag:
        description: Optional tag override for manual runs (e.g. v2.0.6)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install qgis-plugin-ci
        run: python -m pip install --upgrade pip qgis-plugin-ci

      - name: Resolve release values
        id: release_values
        env:
          PLUGIN_RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          PLUGIN_INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          PLUGIN_INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: python tools/resolve_release_values.py

      - name: Prepare live plugin directory
        env:
          PLUGIN_RELEASE_VERSION: ${{ steps.release_values.outputs.release_version }}
        shell: bash
        run: |
          rm -rf kavitro_live
          mkdir -p kavitro_live

          # Internal operating guides are kept in Git, but must never ship in LIVE.
          rsync -a ./ kavitro_live/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitattributes' \
            --exclude '.gitignore' \
            --exclude 'kavitro_live/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '*.log' \
            --exclude '.venv/' \
            --exclude '.pytest_cache/' \
            --exclude '.zencoder/' \
            --exclude '.zenflow/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'docs/juhendid/' \
            --exclude 'docs/' \
            --exclude 'reports/' \
            --exclude 'tests/' \
            --exclude 'tools/' \
            --exclude 'Temporary/' \
            --exclude 'tmp_release_repo/' \
            --exclude 'bpmn/' \
            --exclude 'vs-code-bpmn-io/' \
            --exclude '*.md' \
            --exclude 'avariitööd.gpkg' \
            --exclude 'wfs-property-query.html' \
            --exclude 'config/config_dev.json' \
            --exclude 'metadata.dev.txt' \
            --exclude 'metadata.release.txt'

          python - <<'PY'
          import os
          from pathlib import Path

          metadata_path = Path("kavitro_live/metadata.txt")
          release_version = os.environ["PLUGIN_RELEASE_VERSION"]
          text = metadata_path.read_text(encoding="utf-8")
          lines = text.splitlines()

          out = []
          for line in lines:
              if line.startswith("name="):
                  value = line.split("=", 1)[1]
                  value = value.replace(" [DEV]", "").replace("[DEV]", "").strip()
                  out.append(f"name={value}")
                  continue
              if line.startswith("experimental="):
                  out.append("experimental=False")
                  continue
              if line.startswith("version="):
                  out.append(f"version={release_version}")
                  continue
              out.append(line)

          metadata_path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

          cat > .qgis-plugin-ci << 'EOF'
          plugin_path: kavitro_live
          github_organization_slug: KalverTammik
          project_slug: wild_code
          EOF

      - name: Validate live plugin contents
        shell: bash
        run: |
          forbidden_dirs=(
            .git .github .venv .pytest_cache .zencoder .zenflow
            __pycache__ build dist docs/juhendid docs reports tests tools Temporary
            tmp_release_repo bpmn vs-code-bpmn-io
          )
          forbidden_files=(
            .gitattributes .gitignore avariitööd.gpkg
            metadata.dev.txt metadata.release.txt wfs-property-query.html
          )

          for path in "${forbidden_dirs[@]}"; do
            if [ -e "kavitro_live/${path}" ]; then
              echo "ERROR: development directory reached the live plugin: ${path}"
              exit 1
            fi
          done

          for path in "${forbidden_files[@]}"; do
            if [ -e "kavitro_live/${path}" ]; then
              echo "ERROR: development file reached the live plugin: ${path}"
              exit 1
            fi
          done

          forbidden_match="$(find kavitro_live -type f \( \
            -name '*.md' -o -name '*.log' -o -name '*.pyc' -o -name '*.pyo' \
          \) -print -quit)"
          if [ -n "${forbidden_match}" ]; then
            echo "ERROR: development artifact reached the live plugin: ${forbidden_match}"
            exit 1
          fi

          echo "Validated live plugin staging directory."
          du -sh kavitro_live

      - name: Stage generated release files
        run: |
          git add -A kavitro_live .qgis-plugin-ci

      - name: Ensure GitHub release exists (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_TAG: ${{ steps.release_values.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "${PLUGIN_RELEASE_TAG}" >/dev/null 2>&1 || gh release create "${PLUGIN_RELEASE_TAG}" --target "${GITHUB_SHA}" --title "${PLUGIN_RELEASE_TAG}" --notes "Manual release ${PLUGIN_RELEASE_TAG}"

      - name: Deploy plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_VERSION: ${{ steps.release_values.outputs.release_version }}
          PLUGIN_RELEASE_TAG: ${{ steps.release_values.outputs.release_tag }}
        run: |
          qgis-plugin-ci release "${PLUGIN_RELEASE_VERSION}" \
            --release-tag "${PLUGIN_RELEASE_TAG}" \
            --github-token "${GITHUB_TOKEN}" \
            --create-plugin-repo \
            --allow-uncommitted-changes

      - name: Build changelog-aware repository assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_TAG: ${{ steps.release_values.outputs.release_tag }}
          PLUGIN_RELEASE_TITLE: ${{ github.event.release.name }}
          PLUGIN_RELEASE_BODY: ${{ github.event.release.body }}
        shell: bash
        run: |
          NOTES_FILE="release_notes.md"
          PREVIOUS_XML_FILE="previous_plugins.xml"

          # Always have a visible changelog header in QGIS Plugin Manager.
          if [ -z "${PLUGIN_RELEASE_TITLE}" ]; then
            PLUGIN_RELEASE_TITLE="${PLUGIN_RELEASE_TAG}"
          fi

          # For manual dispatch, fetch release title/body from GitHub API when available.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            API_PATH="repos/${GITHUB_REPOSITORY}/releases/tags/${PLUGIN_RELEASE_TAG}"
            API_TITLE="$(gh api "${API_PATH}" --jq '.name // .tag_name' 2>/dev/null || true)"
            API_BODY="$(gh api "${API_PATH}" --jq '.body // ""' 2>/dev/null || true)"
            if [ -n "${API_TITLE}" ]; then
              PLUGIN_RELEASE_TITLE="${API_TITLE}"
            fi
            if [ -n "${API_BODY}" ]; then
              PLUGIN_RELEASE_BODY="${API_BODY}"
            fi
          fi

          if [ -n "${PLUGIN_RELEASE_BODY}" ]; then
            printf '%s\n' "${PLUGIN_RELEASE_BODY}" > "${NOTES_FILE}"
          fi

          PREV_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq "[.[] | select(.tag_name != \"${PLUGIN_RELEASE_TAG}\")][0].tag_name // \"\"" 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            PREV_XML_URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREV_TAG}" --jq '.assets[] | select(.name=="plugins.xml") | .browser_download_url' 2>/dev/null || true)"
            if [ -n "${PREV_XML_URL}" ]; then
              curl -fsSL "${PREV_XML_URL}" -o "${PREVIOUS_XML_FILE}" || true
            fi
          fi

          CMD=(
            python tools/qgis_repo_release.py
            --plugin-dir kavitro_live
            --out release_repo
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${PLUGIN_RELEASE_TAG}/"
            --release-tag "${PLUGIN_RELEASE_TAG}"
            --release-title "${PLUGIN_RELEASE_TITLE}"
          )
          if [ -s "${NOTES_FILE}" ]; then
            CMD+=(--release-notes-file "${NOTES_FILE}")
          fi
          if [ -s "${PREVIOUS_XML_FILE}" ]; then
            CMD+=(--previous-plugins-xml "${PREVIOUS_XML_FILE}")
          fi
          "${CMD[@]}"

      - name: Validate changelog exists in plugins.xml
        shell: bash
        run: |
          if ! grep -q "<changelog>" release_repo/plugins.xml; then
            echo "ERROR: release_repo/plugins.xml is missing <changelog>."
            cat release_repo/plugins.xml
            exit 1
          fi

      - name: Upload repository assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_TAG: ${{ steps.release_values.outputs.release_tag }}
        shell: bash
        run: |
          gh release upload "${PLUGIN_RELEASE_TAG}" \
            release_repo/plugins.xml \
            release_repo/*.zip \
            release_repo/*.png \
            --clobber

      - name: Mark release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_TAG: ${{ steps.release_values.outputs.release_tag }}
        shell: bash
        run: |
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PLUGIN_RELEASE_TAG}" --jq '.id')"

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F make_latest=true \
            -F prerelease=false
