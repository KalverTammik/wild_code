name: Release QGIS Plugin

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to package from an existing draft release (e.g. 2.0.6)
        required: true
      release_tag:
        description: Optional draft release tag override (e.g. v2.0.6)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve release values
        id: release_values
        env:
          PLUGIN_INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          PLUGIN_INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: python tools/resolve_release_values.py

      - name: Prepare live plugin directory
        env:
          PLUGIN_RELEASE_VERSION: ${{ steps.release_values.outputs.release_version }}
        shell: bash
        run: |
          rm -rf kavitro_live
          mkdir -p kavitro_live

          # Internal operating guides are kept in Git, but must never ship in LIVE.
          rsync -a ./ kavitro_live/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitattributes' \
            --exclude '.gitignore' \
            --exclude 'kavitro_live/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '*.log' \
            --exclude '.venv/' \
            --exclude '.pytest_cache/' \
            --exclude '.zencoder/' \
            --exclude '.zenflow/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'docs/juhendid/' \
            --exclude 'docs/' \
            --exclude 'reports/' \
            --exclude 'tests/' \
            --exclude 'tools/' \
            --exclude 'Temporary/' \
            --exclude 'tmp_release_repo/' \
            --exclude 'bpmn/' \
            --exclude 'vs-code-bpmn-io/' \
            --exclude '*.md' \
            --exclude 'avariitööd.gpkg' \
            --exclude 'wfs-property-query.html' \
            --exclude 'config/config_dev.json' \
            --exclude 'metadata.dev.txt' \
            --exclude 'metadata.release.txt'

          # LIVE metadata is an explicit source of truth. In particular, its
          # icon must not inherit the visually distinct DEV metadata icon.
          cp metadata.release.txt kavitro_live/metadata.txt

          python - <<'PY'
          import os
          from pathlib import Path

          metadata_path = Path("kavitro_live/metadata.txt")
          release_version = os.environ["PLUGIN_RELEASE_VERSION"]
          text = metadata_path.read_text(encoding="utf-8")
          lines = text.splitlines()

          out = []
          for line in lines:
              if line.startswith("version="):
                  out.append(f"version={release_version}")
                  continue
              out.append(line)

          metadata_path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Validate live plugin contents
        shell: bash
        run: |
          forbidden_dirs=(
            .git .github .venv .pytest_cache .zencoder .zenflow
            __pycache__ build dist docs/juhendid docs reports tests tools Temporary
            tmp_release_repo bpmn vs-code-bpmn-io
          )
          forbidden_files=(
            .gitattributes .gitignore avariitööd.gpkg
            metadata.dev.txt metadata.release.txt wfs-property-query.html
          )

          for path in "${forbidden_dirs[@]}"; do
            if [ -e "kavitro_live/${path}" ]; then
              echo "ERROR: development directory reached the live plugin: ${path}"
              exit 1
            fi
          done

          for path in "${forbidden_files[@]}"; do
            if [ -e "kavitro_live/${path}" ]; then
              echo "ERROR: development file reached the live plugin: ${path}"
              exit 1
            fi
          done

          forbidden_match="$(find kavitro_live -type f \( \
            -name '*.md' -o -name '*.log' -o -name '*.pyc' -o -name '*.pyo' \
          \) -print -quit)"
          if [ -n "${forbidden_match}" ]; then
            echo "ERROR: development artifact reached the live plugin: ${forbidden_match}"
            exit 1
          fi

          if ! grep -Fxq 'name=Kavitro' kavitro_live/metadata.txt; then
            echo "ERROR: LIVE plugin metadata name is not Kavitro."
            exit 1
          fi
          if ! grep -Fxq 'experimental=False' kavitro_live/metadata.txt; then
            echo "ERROR: LIVE plugin metadata is not stable."
            exit 1
          fi
          if ! grep -Fxq 'icon=resources/icons/Kavitro-favicon-96x96.png' kavitro_live/metadata.txt; then
            echo "ERROR: LIVE plugin metadata does not use the approved Kavitro icon."
            exit 1
          fi
          if [ ! -f kavitro_live/resources/icons/Kavitro-favicon-96x96.png ]; then
            echo "ERROR: Approved Kavitro icon is missing from the LIVE plugin."
            exit 1
          fi

          echo "Validated live plugin staging directory."
          du -sh kavitro_live

      - name: Resolve draft release
        id: draft_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_TAG: ${{ steps.release_values.outputs.release_tag }}
        shell: bash
        run: |
          RELEASE_JSON_FILE="${RUNNER_TEMP}/kavitro-draft-release.json"
          RELEASE_TITLE_FILE="${RUNNER_TEMP}/kavitro-release-title.txt"
          RELEASE_NOTES_FILE="${RUNNER_TEMP}/kavitro-release-notes.md"

          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq --arg tag "${PLUGIN_RELEASE_TAG}" \
                '[.[] | select(.tag_name == $tag)] | first' \
            > "${RELEASE_JSON_FILE}"

          if [ "$(jq -r 'if . == null then "missing" else "found" end' "${RELEASE_JSON_FILE}")" != "found" ]; then
            echo "ERROR: Draft release ${PLUGIN_RELEASE_TAG} does not exist. Create and save the draft before running this workflow."
            exit 1
          fi
          if [ "$(jq -r '.draft' "${RELEASE_JSON_FILE}")" != "true" ]; then
            echo "ERROR: Release ${PLUGIN_RELEASE_TAG} is already published. Published release assets must not be replaced."
            exit 1
          fi
          if [ "$(jq -r '.assets | length' "${RELEASE_JSON_FILE}")" != "0" ]; then
            echo "ERROR: Draft release ${PLUGIN_RELEASE_TAG} already contains assets. Start from an empty draft so no unverified asset is published."
            exit 1
          fi

          TAG_REF="refs/tags/${PLUGIN_RELEASE_TAG}"
          TAG_REFS="$(git ls-remote origin "${TAG_REF}" "${TAG_REF}^{}")"
          if [ -z "${TAG_REFS}" ]; then
            CREATED_TAG_FILE="${RUNNER_TEMP}/kavitro-created-tag.json"
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="${TAG_REF}" \
              -f sha="${GITHUB_SHA}" \
              > "${CREATED_TAG_FILE}"

            if [ "$(jq -r '.ref' "${CREATED_TAG_FILE}")" != "${TAG_REF}" ] || \
               [ "$(jq -r '.object.sha' "${CREATED_TAG_FILE}")" != "${GITHUB_SHA}" ]; then
              echo "ERROR: GitHub did not create the requested release tag at the checked-out commit."
              exit 1
            fi
          else
            TAG_COMMIT="$(printf '%s\n' "${TAG_REFS}" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
            if [ -z "${TAG_COMMIT}" ]; then
              TAG_COMMIT="$(printf '%s\n' "${TAG_REFS}" | awk 'NR == 1 { print $1 }')"
            fi
            if [ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]; then
              echo "ERROR: Existing tag ${PLUGIN_RELEASE_TAG} does not point to the commit checked out by this workflow."
              exit 1
            fi
          fi

          RELEASE_ID="$(jq -r '.id' "${RELEASE_JSON_FILE}")"
          if ! [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Draft release id is invalid."
            exit 1
          fi

          # Pin the future immutable tag to the exact commit checked out by this run.
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f tag_name="${PLUGIN_RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            > "${RELEASE_JSON_FILE}"

          if [ "$(jq -r '.tag_name' "${RELEASE_JSON_FILE}")" != "${PLUGIN_RELEASE_TAG}" ]; then
            echo "ERROR: Draft release did not retain the requested tag name."
            exit 1
          fi

          jq -r 'if (.name // "") == "" then .tag_name else .name end' \
            "${RELEASE_JSON_FILE}" > "${RELEASE_TITLE_FILE}"
          jq -r '.body // ""' "${RELEASE_JSON_FILE}" > "${RELEASE_NOTES_FILE}"
          printf 'release_id=%s\n' "${RELEASE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Build changelog-aware repository assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_TAG: ${{ steps.release_values.outputs.release_tag }}
        shell: bash
        run: |
          RELEASE_TITLE_FILE="${RUNNER_TEMP}/kavitro-release-title.txt"
          NOTES_FILE="${RUNNER_TEMP}/kavitro-release-notes.md"
          PREVIOUS_XML_FILE="previous_plugins.xml"
          RELEASES_FILE="${RUNNER_TEMP}/kavitro-published-releases.json"
          PLUGIN_RELEASE_TITLE="$(cat "${RELEASE_TITLE_FILE}")"

          # Always have a visible changelog header in QGIS Plugin Manager.
          if [ -z "${PLUGIN_RELEASE_TITLE}" ]; then
            PLUGIN_RELEASE_TITLE="${PLUGIN_RELEASE_TAG}"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${RELEASES_FILE}"
          PREV_TAG="$(jq -r --arg tag "${PLUGIN_RELEASE_TAG}" \
            '[.[] | select(.draft == false and .tag_name != $tag)] | sort_by(.published_at) | reverse | .[0].tag_name // ""' \
            "${RELEASES_FILE}")"
          if [ -n "${PREV_TAG}" ]; then
            PREV_XML_URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREV_TAG}" --jq '.assets[] | select(.name=="plugins.xml") | .browser_download_url' 2>/dev/null || true)"
            if [ -n "${PREV_XML_URL}" ]; then
              curl -fsSL "${PREV_XML_URL}" -o "${PREVIOUS_XML_FILE}" || true
            fi
          fi

          CMD=(
            python tools/qgis_repo_release.py
            --plugin-dir kavitro_live
            --out release_repo
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${PLUGIN_RELEASE_TAG}/"
            --release-tag "${PLUGIN_RELEASE_TAG}"
            --release-title "${PLUGIN_RELEASE_TITLE}"
          )
          if [ -s "${NOTES_FILE}" ]; then
            CMD+=(--release-notes-file "${NOTES_FILE}")
          fi
          if [ -s "${PREVIOUS_XML_FILE}" ]; then
            CMD+=(--previous-plugins-xml "${PREVIOUS_XML_FILE}")
          fi
          "${CMD[@]}"

      - name: Validate changelog exists in plugins.xml
        shell: bash
        run: |
          if ! grep -q "<changelog>" release_repo/plugins.xml; then
            echo "ERROR: release_repo/plugins.xml is missing <changelog>."
            cat release_repo/plugins.xml
            exit 1
          fi

      - name: Upload repository assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_ID: ${{ steps.draft_release.outputs.release_id }}
        shell: bash
        run: |
          shopt -s nullglob
          ASSETS=(release_repo/plugins.xml release_repo/*.zip release_repo/*.png)
          if [ "${#ASSETS[@]}" -ne 3 ]; then
            echo "ERROR: Expected exactly plugins.xml, one plugin ZIP and one icon before upload."
            exit 1
          fi

          UPLOAD_BASE_URL="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${PLUGIN_RELEASE_ID}/assets"
          UPLOAD_INDEX=0
          for ASSET_PATH in "${ASSETS[@]}"; do
            ASSET_NAME="$(basename "${ASSET_PATH}")"
            ENCODED_ASSET_NAME="$(jq -rn --arg value "${ASSET_NAME}" '$value | @uri')"
            UPLOAD_RESPONSE="${RUNNER_TEMP}/kavitro-upload-${UPLOAD_INDEX}.json"

            curl --fail-with-body --silent --show-error -L \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/octet-stream' \
              "${UPLOAD_BASE_URL}?name=${ENCODED_ASSET_NAME}" \
              --data-binary "@${ASSET_PATH}" \
              > "${UPLOAD_RESPONSE}"

            if ! jq -e --arg name "${ASSET_NAME}" \
              '.name == $name and .state == "uploaded"' \
              "${UPLOAD_RESPONSE}" >/dev/null; then
              echo "ERROR: GitHub did not confirm a completed upload for ${ASSET_NAME}."
              exit 1
            fi
            UPLOAD_INDEX=$((UPLOAD_INDEX + 1))
          done

      - name: Verify uploaded release asset digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_ID: ${{ steps.draft_release.outputs.release_id }}
        shell: bash
        run: |
          RELEASE_JSON_FILE="${RUNNER_TEMP}/kavitro-uploaded-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${PLUGIN_RELEASE_ID}" > "${RELEASE_JSON_FILE}"

          shopt -s nullglob
          ASSETS=(release_repo/plugins.xml release_repo/*.zip release_repo/*.png)
          REMOTE_ASSET_COUNT="$(jq -r '.assets | length' "${RELEASE_JSON_FILE}")"
          if [ "${REMOTE_ASSET_COUNT}" -ne "${#ASSETS[@]}" ]; then
            echo "ERROR: GitHub draft contains an unexpected number of assets."
            exit 1
          fi

          for ASSET_PATH in "${ASSETS[@]}"; do
            ASSET_NAME="$(basename "${ASSET_PATH}")"
            EXPECTED_DIGEST="sha256:$(sha256sum "${ASSET_PATH}" | awk '{print $1}')"
            ACTUAL_DIGEST="$(jq -r --arg name "${ASSET_NAME}" \
              '.assets[] | select(.name == $name and .state == "uploaded") | .digest // empty' \
              "${RELEASE_JSON_FILE}")"
            if [ "${ACTUAL_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
              echo "ERROR: GitHub asset digest mismatch for ${ASSET_NAME}."
              exit 1
            fi
          done

      - name: Publish and lock release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_RELEASE_ID: ${{ steps.draft_release.outputs.release_id }}
          PLUGIN_RELEASE_TAG: ${{ steps.release_values.outputs.release_tag }}
        shell: bash
        run: |
          PUBLISHED_RELEASE_FILE="${RUNNER_TEMP}/kavitro-published-release.json"

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${PLUGIN_RELEASE_ID}" \
            -f tag_name="${PLUGIN_RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -F draft=false \
            -F make_latest=true \
            -F prerelease=false \
            > "${PUBLISHED_RELEASE_FILE}"

          if [ "$(jq -r '.immutable' "${PUBLISHED_RELEASE_FILE}")" != "true" ]; then
            echo "ERROR: Release was published but is not immutable. Enable release immutability in the repository settings before the next release."
            exit 1
          fi
          if [ "$(jq -r '.tag_name' "${PUBLISHED_RELEASE_FILE}")" != "${PLUGIN_RELEASE_TAG}" ]; then
            echo "ERROR: Published release is not associated with the requested tag."
            exit 1
          fi
          if [ "$(jq -r '.target_commitish' "${PUBLISHED_RELEASE_FILE}")" != "${GITHUB_SHA}" ]; then
            echo "ERROR: Published release target does not match the checked-out commit."
            exit 1
          fi

          EXPECTED_DOWNLOAD_SEGMENT="/releases/download/${PLUGIN_RELEASE_TAG}/"
          if ! jq -e --arg segment "${EXPECTED_DOWNLOAD_SEGMENT}" \
            'all(.assets[]; (.browser_download_url | contains($segment)))' \
            "${PUBLISHED_RELEASE_FILE}" >/dev/null; then
            echo "ERROR: Published asset URLs do not use the requested release tag."
            exit 1
          fi
