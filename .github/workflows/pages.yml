name: Deploy GitHub Pages (docs)

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare public documentation
        shell: bash
        run: |
          mkdir -p public_docs
          rsync -a docs/ public_docs/ --exclude 'juhendid/'

          if [ -e public_docs/juhendid ]; then
            echo "ERROR: Internal docs/juhendid directory reached the public Pages artifact."
            exit 1
          fi

      - name: Upload artifact (public docs)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public_docs"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
