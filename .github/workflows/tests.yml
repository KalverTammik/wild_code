name: Tests

# Runs the offline suite in the official QGIS 3.40 and 4.4 images on every push to main and every
# pull request. The release workflow calls it too and publishes only when it passes.
# Linux also runs the tests that skip on Windows (POSIX file modes, symlinks).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when the release workflow calls this one, so a push
# to main never cancels the tests a release is waiting for.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.6
          ruff check .

  tests:
    name: tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Both results are wanted: a change can break one Qt version only.
      fail-fast: false
      matrix:
        include:
          - image: qgis/qgis:3.40.13-noble
            # QGIS' own Python plugins (processing) for the tests that import them.
            pythonpath: /usr/share/qgis/python/plugins
          - image: qgis/qgis:4.4
            pythonpath: /usr/share/qgis/python:/usr/share/qgis/python/plugins
    container:
      image: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ matrix.pythonpath }}
    steps:
      # The tests import the plugin as the package "Kavitro_dev", so the checkout folder carries that name.
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: Kavitro_dev

      - name: Run the offline test suite
        working-directory: Kavitro_dev
        # A hung test (an unmocked request or a modal dialog) stops at the limit instead of
        # holding the runner; the exit code is the suite's, so a crash after "OK" still fails.
        run: timeout 1200 python3 tools/run_tests.py
