query ModuleTagsWithGroups($first: Int!, $after: String, $where: QueryTagsWhereWhereConditions) {
  tags(first: $first, after: $after, where: $where) {
    pageInfo {
      hasNextPage
      endCursor
      total
    }
    edges {
      node {
        id
        name
        group {
          id
          name
        }
      }
    }
  }
}
