query property(
  $id: ID!
  $first: Int
  $after: String
) {
  property(id: $id) {
    __typename
    id
    tasks(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
        total
      }
      edges {
        node {
          __typename
          id
          title
          startAt
          dueAt
          createdAt
          updatedAt
          members {
            edges {
              node {
                id
                displayName
                deletedAt
              }
              responsible
            }
          }
          status {
            id
            name
            color
            type
          }
          priority
          type {
            id
            name
          }
          properties(first: 1) {
            pageInfo {
              count
            }
          }
        }
      }
    }
  }
}

