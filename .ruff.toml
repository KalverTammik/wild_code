# Lint rules for the plugin: `ruff check .` from the plugin root.
# The file starts with a dot, so the release zip leaves it out (tools/qgis_repo_release.py).
extend-exclude = [".venv", "Temporary"]

[lint]
# F: real errors (undefined names, unused imports). E/W: pycodestyle. B: bugbear (likely bugs).
# PIE: redundant code. RUF100: noqa comments that no longer hide anything.
select = ["F", "E", "W", "B", "PIE", "RUF100"]
ignore = [
    "E501", # line length: the code base uses long lines on purpose, a formatter pass is a separate decision
    "B905", # zip(strict=) is not used yet; enforcing it is a separate decision
]
# Codes of rules that are not selected but whose noqa comments document intent:
# N802 Qt override names (mousePressEvent), BLE001 a deliberate broad except, D401 docstring mood.
external = ["N802", "BLE001", "D401"]

[lint.flake8-bugbear]
# Qt's invalid index is the usual default of model methods and is never changed.
extend-immutable-calls = ["qgis.PyQt.QtCore.QModelIndex"]

[lint.per-file-ignores]
# Test modules put the plugin root on sys.path before importing it; their closures in loops
# are called inside the same iteration, and short lambdas stand in for fakes.
"tests/*" = ["E402", "B023", "E731"]
# h, s, l is the usual HSL notation, and the conversion table is aligned on purpose.
"utils/status_color_helper.py" = ["E741", "E701"]
"widgets/DataDisplayWidgets/MembersView.py" = ["E741"]
